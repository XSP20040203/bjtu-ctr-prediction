<desc>同一个用户一天里可能看到很多条广告，也可能看过很多条资讯。先把资讯汇总成“这个用户这一天是什么状态”，再把这份状态复制给当天属于他的每条广告。这样连接不会把广告行数越连越多。
训练标签单独保存。预测日广告标签不进入特征；历史点击统计只读预测日以前的真实广告反馈。同日无标签广告曝光数和给定资讯反馈的使用条件与线上逐次预测并不相同。</desc>
