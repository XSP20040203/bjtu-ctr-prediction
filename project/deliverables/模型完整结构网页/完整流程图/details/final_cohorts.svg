<desc>没有历史广告点击的用户，用户身份向量可能帮助较少，语义关系树侧重当前候选与历史集合的联系。即使用户没有过去广告点击标签，也可能存在给定的历史列表和资讯行为。
最后一步用任务历史曝光数判断支持度。历史未见任务的曝光数是 0，也满足不超过 100；出现过但曝光很少的任务同样可能进入。均值、标准差和分位映射来自输入或预测分数，不来自 17 日标签。</desc>
