<desc>二元日模型判断“用户这天会不会至少点一次”，泊松日模型预测“用户这天大概点几次”。两者含义不同，所以回写到行概率的公式也不同，不能统一写成概率相乘。
power 控制采纳日级模型的力度，例如 0.125 表示只采用较弱的比例修正。比例还会限幅，避免某个日级预测让整组广告分数极端变化。后文写“二元校正”或“泊松校正”时，都使用这张图中的对应运算。</desc>
