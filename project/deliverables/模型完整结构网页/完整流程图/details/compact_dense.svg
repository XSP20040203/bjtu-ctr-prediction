<desc>紧凑日级模型输入是 540 维。“192”只是精选普通数值的数量，还必须加上 337 维资讯质量和 11 个类别。694 维行树则从丰富行特征中固定选列，不能与 1017 维完整质量排序树混淆。
增量迁移会把同组平均变化和组内偏离分别控制。用户分组保留用户整体强度，任务分组调整任务之间和任务内部的变化。最后的轻量排序模型只替换一部分用户内排序，用来补充同一用户更可能点哪条广告。</desc>
