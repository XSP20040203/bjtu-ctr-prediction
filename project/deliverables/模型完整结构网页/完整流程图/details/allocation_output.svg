<desc>它先估计用户今天可能产生多大点击总量，再决定哪些广告分到更多份额。这样既考虑“一天整体点多少”，也考虑“这一天更偏向哪条广告”。
λ 是非负强度，数值可以超过 1；最终 p 才是 0 到 1 之间的概率。训练时必须保留完整用户日组，否则组内 Softmax 会在残缺的广告集合上错误分配总量。</desc>
