<desc>不同公式中的 0.1 不能直接当成同一种“10%”。概率平均、Logit 替换、加分、组内替换和日级比例校正操作不同，必须结合框中的运算理解。标准差对齐还会用很小的下限避免除以零。
组内排序先去掉组均值，再调节同一用户内部的高低差异。组间组内迁移则处理一项校正相对其锚点的变化。分位映射使用排名位置，和只调整均值标准差不是同一种变换。</desc>
