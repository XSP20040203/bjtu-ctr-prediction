<desc>交叉分支显式学习“用户特征和广告特征合在一起会怎样”；深层分支逐步压缩和组合输入。两个分支并行读取同一个向量，最后拼在一起，不能把 128、64 再加回输入维度当成新的原始特征。
基础有界编号网络、多时间尺度网络和分组折外曝光网络是分别训练的成员。前者与曝光成员都使用 478 维网络输入，形状相同不等于权重相同。树模型不经过上述网络层，直接读取各自的表格特征。</desc>
