<desc>任务受众模型先看“这条任务主要展示给了什么样的人”。17日有34,510个任务日组。337项质量各计算按曝光加权均值、去重用户均值和曝光标准差，贡献1011维；另有40项用户、任务、广告主和应用的历史反应统计。任务广播索引把同一判断复制给看到该任务的所有广告行。
紧凑模型再回到每条广告，在 1209 项候选中挑出 423 项。不是把全部 192 项受众都留下；保存的选择结果里有 85 项受众列。39 个类别列在这 423 项之内，不能额外再加一次。</desc>
