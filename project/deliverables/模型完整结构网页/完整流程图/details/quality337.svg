<desc>如果一个用户点了很多资讯，可能是他活跃，也可能是给他的资讯本来就容易被所有人点。这个模块先参考其他用户对相同内容或条件的表现，再看当前用户比预期多点了多少、少点了多少。
排除当前用户当天的贡献，是为了让“内容本来有多受欢迎”这份估计不直接抄回他自己的反应。预期点击与实际点击的差异、比例以及证据覆盖度一起进入模型，最后增加资讯缺失标记，形成确切的337维。</desc>
