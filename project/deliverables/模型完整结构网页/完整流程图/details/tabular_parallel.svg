<desc>一个数值直接输入网络时只有一个数。分段线性嵌入先描述它落在哪个区间、在区间内处在什么位置，再转换成 4 个数。这让模型更容易学习非线性数值关系。
四个成员共享并行计算形式，同时保留各自的成员参数。最终采用“各自转概率后平均”，因此不能改写成“先平均原始分数再转概率”。类别嵌入 312 维也要与 2140 维数值表示一起进入网络。</desc>
