<desc>门控像给每类资料分配音量：当日资讯状态会影响模型更看重哪类字段。39 个增益分别作用于 39 个字段，不会删掉字段，也不会把 312 维变成 39 维。
每个交叉专家先把大向量压成 32 维，再做一次 32 维变换，最后展开回原宽度。三个专家的比例由门控前的原始内容决定。166 数值成员用于日状态保护网络；500 数值成员作为丰富历史网络独立参加融合。</desc>
