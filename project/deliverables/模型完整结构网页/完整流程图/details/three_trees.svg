<desc>533、489、401 是三份分别构造的树输入，不是一条网络从 533 维压缩到 489 维再压缩到 401 维。它们复用冻结字典和同一份 395 维上下文，但树的权重与适用群体分别保存。
94 维等于 88 维候选及历史向量加 6 个历史点积；也等于 138 减去 8、32 和 4。401 维方案只增加六个关系标量，用更少的特征补充任务、广告主和应用与历史兴趣的关系。</desc>
