<desc>训练阶段会利用标签改模型参数；预测阶段只按保存的参数算分。某份树模型没有重训到 16 日，不意味着它读不到截至 16 日的真实历史统计：模型权重的训练截止日和输入历史的可用截止日是两件事。
最终融合并非所有成员一起端到端训练。神经网络、日级模型、行级树、后验统计和融合规则先后训练与冻结，预测时按依赖关系组合。本次报告整理没有恢复训练，也没有重新评估反推标签。</desc>
