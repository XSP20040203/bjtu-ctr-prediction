<desc>这一组四树是分别训练的，不是把四种深度轮数参数放进同一棵树。先对每个成员做分位映射再平均，也不同于先平均原始分数再映射。名称说明训练侧重，实际应用范围按保存的“点击历史变化”掩码执行。
应用事件后验先把多行广告放在同一个历史变化事件里，再利用事件至少一次点击的概率修正各行边际概率。源码可以生成多个实体通道，最终采用的通道是应用；没有把未选通道的结果一起叠加。</desc>
