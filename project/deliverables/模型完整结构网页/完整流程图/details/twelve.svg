<desc>十二份意见是并行产生的，不是前一棵树的结果再送进下一棵树。整体日模型看一天的总状态，子群模型把一天再按广告位、应用或任务细分，处理同一个用户面对不同对象的区别。
每个子群输入 88 维，由 80 个选定参考上下文、4 个当前分数统计、3 个额外统计和 1 个子群类别组成。不同子群的组数可以不同，广播后仍都是 N × 1。图中六组意见并列展示，彼此没有顺序连接。温度属于相应成对模型的训练设定。</desc>
