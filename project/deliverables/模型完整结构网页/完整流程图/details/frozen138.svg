<desc>冻结表示是把网络已经学到的数字关系抽出来，交给树模型使用。树训练只学习怎样利用这些数，不会反向更新教师。这里的教师不是逐日折外教师，因此不能把这份表示称为逐日折外特征。
逐元素乘积会留下 8 个坐标，而点积会把这 8 个乘积加成 1 个数。所以同样是比较两个向量，前者贡献 8 维，后者贡献 1 维。两者同时保留时不能漏数。</desc>
