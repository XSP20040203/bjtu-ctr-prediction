<desc>嵌入表可以理解成一本“编号到数字描述”的字典。任务编号本身没有大小含义，把它查成 8 个可学习的数后，模型才能学出哪些任务的表现接近。相同实体类型的当前候选与历史项共用字典。
PAD 编号为 0，未知编号为 1。某些模型还把用户、任务和广告编号向量的读取范数限制为 0.2，减少只靠记住编号得到高分的倾向。均值池化保留总体兴趣，没有为五个位置添加时间先后含义。</desc>
