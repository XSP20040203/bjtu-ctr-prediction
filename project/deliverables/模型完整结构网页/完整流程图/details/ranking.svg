<desc>用户内排序关心同一用户的两条广告谁更可能被点；跨用户排序补充不同用户之间的相对分数。二者训练目标相似，但组定义和融合方式不同，不能合并成一个“排序模块”后省略。
冷任务指预测日前真实广告历史中没有出现的任务，和曝光不超过100次的低支持任务是不同条件。时间半衰期2天表示样本每旧2天，权重约减半，较早样本仍可参与训练。近期日率和跨用户模型存在使用截至16日数据的专门重训导出，后面的冻结修正树则多保留截至15日的权重。</desc>
