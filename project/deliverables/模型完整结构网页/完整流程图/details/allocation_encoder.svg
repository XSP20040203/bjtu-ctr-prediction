<desc>这个网络先把用户今天看到的广告放在一起看。四个槽可以理解为四份可学习的摘要；某条广告再根据自身特征，从四份摘要中取出相关的信息。槽不是四个真实人工类别。
行级 256 维来自四份各 64 维的内容；日级 193 维来自三份各 64 维的摘要再加一个组大小。两种维度分别服务于广告排序和用户日总点击强度。</desc>
