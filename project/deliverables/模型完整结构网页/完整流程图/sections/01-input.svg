<g id="a_node&#45;2"><a xlink:title="27 个类别具体包括：用户编号、年龄、性别、居住地、城市、城市等级；设备系列与分组、设备型号与名称、屏幕尺寸、网络类型；任务、广告编号、创意类型、广告主、交互类型、广告位、推广应用、应用标签、二级分类、应用评分；刷新次数、资讯生命周期、手机价格档、浏览器生命周期、浏览器模式。&#10;&#10;历史统计里常见的数包括曝光数、点击数、平滑点击率、候选是否出现在历史中、距离上次活跃的天数，以及相对个人过去状态的变化。500 维和 535 维来自两份实际特征清单，不能把它们理解成同一份向量截取前若干列。">
