<title>n44</title>
<g id="a_node&#45;44"><a xlink:title="291 维行模型同时看当前广告和用户日摘要，可以直接区分同一用户看到的不同广告。两个日模型则各自从相同的行概率起点出发，根据整天状态做不同含义的校正，再用四分之一权重采纳计数分支。&#10;&#10;正样本加权的行树输出先做相应训练偏置还原；其分数不能直接当作未经校正的真实概率。日模型的先验来自此前真实广告点击总量和组大小，使少量点击日的数据更稳定。">
